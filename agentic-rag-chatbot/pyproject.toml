[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phase5-agentic-rag"
version = "0.1.0"
description = "Phase 5 Agentic RAG Orchestrator"
requires-python = ">=3.11"
authors = [
    { name = "Senior Python Engineer" }
]
dependencies = [
    "pydantic>=2.8.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0"
]

[project.scripts]
phase5-agent = "app.agent.agent:main"

[tool.setuptools]
packages = ["app"]
